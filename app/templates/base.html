<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Мини-CRM{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --line: #e3e6ea; --text: #1d2228;
    --muted: #6b7682; --accent: #2b6cb0; --chip: #eef2f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: 14px 20px; display: flex; gap: 16px; align-items: baseline;
  }
  header a { color: var(--accent); text-decoration: none; }
  header h1 { font-size: 17px; margin: 0; }
  main { max-width: 980px; margin: 0 auto; padding: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px; margin-bottom: 18px;
  }
  h2 { font-size: 15px; margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }
  a.lead { color: var(--accent); text-decoration: none; font-weight: 600; }
  .chip {
    display: inline-block; padding: 2px 9px; margin: 2px 3px 2px 0;
    background: var(--chip); border-radius: 20px; font-size: 12px;
    color: var(--text); text-decoration: none; border: 1px solid var(--line);
  }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .muted { color: var(--muted); font-size: 13px; }
  input[type=text], textarea, select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 7px; font: inherit; background: #fff; color: var(--text);
  }
  textarea { min-height: 72px; resize: vertical; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 4px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .row > div { flex: 1 1 200px; }
  button {
    padding: 8px 16px; border: none; border-radius: 7px; background: var(--accent);
    color: #fff; font: inherit; cursor: pointer;
  }
  button.link {
    background: none; color: var(--muted); padding: 0 2px; font-size: 12px;
  }
  form.inline { display: inline; }
  .toolbar { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <h1><a href="/leads">Мини-CRM</a></h1>
  <span class="muted">заявки агентства</span>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
